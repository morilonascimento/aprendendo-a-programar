<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Pessoas</title>
 
  <!-- Liga o arquivo de estilos (CSS) -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
 
  <main class="container">
    <h1>Cadastro de Pessoas</h1>
 
    <!-- FORMULÁRIO: onde o usuário digita os dados -->
    <form id="formPessoa">
      <label for="nome">Nome</label>
      <input type="text" id="nome" placeholder="Digite o nome" required>
 
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="Digite o e-mail" required>
 
      <label for="telefone">Telefone</label>
      <input type="tel" id="telefone" placeholder="(00) 00000-0000">
 
      <label for="nascimento">Data de nascimento</label>
      <input type="date" id="nascimento">
 
      <button type="submit">Cadastrar</button>
    </form>
 
    <!-- LISTA: mostra as pessoas cadastradas -->
    <h2>Pessoas cadastradas (<span id="total">0</span>)</h2>
 
    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>E-mail</th>
          <th>Telefone</th>
          <th>Nascimento</th>
          <th>Ação</th>
        </tr>
      </thead>
      <tbody id="listaPessoas">
        <!-- As linhas são criadas pelo JavaScript -->
      </tbody>
    </table>
 
    <p id="mensagemVazia">Nenhuma pessoa cadastrada ainda.</p>
  </main>
 
  <!-- Liga o arquivo de comportamento (JavaScript) -->
  <script src="script.js"></script>
</body>
</html>
