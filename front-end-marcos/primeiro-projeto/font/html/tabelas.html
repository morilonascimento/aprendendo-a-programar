<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        .tabela-1 {
            border: solid 2px;
        }

        .cabeçalho-1 {
            border: solid 2px;
        }

        .celula-1{
            border: solid 2px;
        }

        div {
            margin-top: 10%;
            margin-left: 30%;
        }

        img {
            margin-bottom: -4px;
            width: 75px;
        }
    </style>
</head>
<body>
    <div>
        <!-- Tabela-->
        <table class="tabela-1">
            <tr>
                <th class="cabeçalho-1">Nome</th>
                <th class="cabeçalho-1">Cor</th>
                <th class="cabeçalho-1">Potência</th>
                <th class="cabeçalho-1">Imagem</th>
            </tr>
            <tr>
                <td class="celula-1">Supra mk5 </td>
                <td class="celula-1">Amarelo</td>
                <td class="celula-1">382 cv</td>
                <td class="celula-1"><a href="https://www.webmotors.com.br/comprar/toyota/supra/30-i6-turbo-gasolina-a91-cf-edition-automatico/2-portas/2022/78022226" target="_blank"><img src="../../imagens/supra-mk4.webp" alt=""></a></td>
            </tr>
            <tr>
                <td class="celula-1">Nissan R35 GT</td>
                <td class="celula-1">Vermelho</td>
                <td class="celula-1">550 cv</td>
                <td class="celula-1"><img src="../../imagens/nissan-r35.webp" alt=""></td>
            </tr>
            <tr>
                <td class="celula-1">Bugatti Chiron </td>
                <td class="celula-1">Preto</td>
                <td class="celula-1">1.500 cv</td>
                <td class="celula-1"><img src="../../imagens/bugatti-chiron.webp" alt=""></td>
            </tr>
        </table>
    </div>

</body>
</html>
