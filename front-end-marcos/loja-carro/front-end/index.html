<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Carros</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fonte do Google-->
     <link rel="preconnect" href="https://fonts.googleapis.com">
     <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap">
</head>
<body>
    <!-- Cabeçalho do site-->
    <header>
        <div class="conteudo">
            <!-- Barra de navegação-->
            <nav>
                <p class="brand"><strong id="the">The</strong> <strong id="car">Car</strong> Loja de Carros</p>
                <!-- lista dos itens da barra d navegação-->
                 <ul>
                    <li><a href="#catalogo">Catálogo</a></li>
                    <li><a href="#sobre">Sobre Nós</a></li>
                    <li><a href="#patrocinio">Patrocínio</a></li>
                    <li><button class="btn-login">Login</button></li>
                 </ul>
            </nav>

            <!-- Bloco de destaque: texto + imagem lado a lado -->
             <div class="header-block">
                <samp class="tag">Mobilidade Elétrica</samp>

                <!-- Parte do texto -->
                <div class="text">
                    <h1> A empresacerta para você!</h1>
                    <p>Encontre o veículo ideal para o seu dia a dia. Modelos modernos, econômicos e com tecnologia que você precisa para rodar com segurança </p>

                    <!-- botão para ver cátalogo -->
                     <a href="#catalogo">Ver Catálogo</a>
                </div>

                <!-- Imagem do carro-->
                <div class="imagem">
                    <img src="../images/carro.jpg" alt="Foto de um carro elétrico vermelho visto de trás em estúdio">
                </div>
            </div>
        </div>
    </header>
</body>
</html>
