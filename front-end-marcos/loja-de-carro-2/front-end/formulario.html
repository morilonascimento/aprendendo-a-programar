<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* formatação para estilo do corpo do site */
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: bisque;
            color: #333;
        }

        header {
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        
        header h1 {
            font-size: 1.5em;
        }

        header p {
            font-size: .8em;
            margin-top: 5px;
            color: #ccc;
        }

        main {
            max-width: 700px;
            margin: 30px auto;
            background-color: #fff;
            border-radius: 8px;
            padding: 25px 30px;
            box-shadow: 0 0 10px rgba(0, 0, 0);
        }

        main h2 {
            margin-top: 20px;
            color: #333;
            border-bottom: 2px solid #080101;
            padding-bottom: 10px;
        }

        .campo {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
        }

        .campo label {
            margin-bottom: 5px;
            font-weight: bold;
            font-size: .8em;
        }

        .campo input,
        .campo select,
        .campo textarea {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: .8em;
        }

        /* Estilo na class linha 
        os elementos que estão dentro da class linha fiquem na mesmas linha*/
        .linha {
            display: flex;
            gap: 15px;
        }

        .linha .campo {
            flex: 1;
        }

        /* aplicando estilo na div de foto do cliente*/
        .upload-foto {
            margin-top: 5px;
            margin-bottom: 20px;
            padding: 20px;
            text-align: center;
            border: 2px dashed #333;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            border-radius: 12px;
        }

        /* Aplicando estilo no botão*/
        .btn-enviar {
            background-color: rgb(211, 210, 210);
            color: #080101;
            border: none;
            border-radius: 10px;
            padding: 5px 10px;
            margin-top: 20px;
            cursor: pointer;
            font-size: 1em;
        }

        .btn-enviar:hover {
            color: #fff;
        }

        .btn-voltar {
            background-color: rgb(211, 210, 210);
            color: #080101;
            border: none;
            border-radius: 10px;
            padding: 5px 10px;
            margin-top: 20px;
            cursor: pointer;
            font-size: 1em;
            
        }

        .btn-voltar:hover {
            color: #cecdcd;
        }

        .btn-voltar a {
            text-decoration: none;
            color: #080101;
        }

        .btn-voltar a:hover {
            color: #fff;
        }
        footer{
            background-color: #f4f4f4;
            color: #333;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>

<body>
    <!-- Cabeçalho do site-->
    <header>
        <h1>Sistema de Gestão de Clientes</h1>
        <p>Módulo de Cadastro de Pessoas</p>
    </header>

    <!-- Conteúdo pricipal do site -->
     <main>
        <h2>Cadastro de Cliente</h2>
        
        <!-- Iniciando o formulario-->
        <form action="#" method="post" enctype="multipart/form-data">
            <div class="upload-foto">
                <label for="foto"><strong>Foto Cliente</strong></label><br><br>
                <input type="file" id="foto" name="foto" accept="image/*">
            </div>

            <!-- Obter o nome do usuário-->
             <div class="campo">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Digite o nome completo" required>
             </div>

             <!-- Div dos dados pessoais-->
              <div class="linha">
                <div class="campo">
                    <label for="nascimento">Data de Nascimento</label>
                    <input type="date" id="nascimento" name="nascimento" required>
                </div>

                <div class="campo">
                    <label for="genero">Gênero</label>
                    <select id="genero" name="genero">
                        <option value="">Selecione uma das opções</option>
                        <option value="feminino">Feminino</option>
                        <option value="masculino">Masculino</option>
                        <option value="outro">Outros</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
                </div>
              </div>

              <!-- DIV dos contatos-->
               <!-- Segunda linha-->
              <div class="linha">
                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000"maxlength="16" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="email.@dominio.com.br" required >
                </div>
              </div>

              <div class="campo">
                <label for="endereco">Endereço</label>
                <input type="text" id="endereco" name="endereco" placeholder="Rua, número, bairro..." readonly>
              </div>

              <div class="linha">
                <div class="campo">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" name="cidade" placeholder="Digite a sua cidade" required>
                </div>
                <div class="campo">
                    <label for="estado">Estado</label>
                    <select id="estado"name="estado" id="">
                        <option value="">UF</option>
                        <option value="pr">Paraná</option>
                        <option value="rj">Rio de Janeiro</option>
                        <option value="rs">Rio Grande do Sul</option>
                        <option value="sc">Santa Catarina</option>
                        <option value="sp">São Paulo</option>
                    </select>
                </div>
            </div>
            <!-- observações -->
            <div class="campo">
                <label for="observacoes">Obiservações</label>
                <textarea name="observacoes" id="observacoes" rows="4" placeholder="Informações adicionais sobre o cliente"></textarea>
            </div>

            <!-- botão para enviar os dados-->
                <input type="submit" value="Salvar" class="btn-enviar">
                <button class="btn-voltar"><a href="index.html">Voltar</a></button>
        </form>
     </main>

     <!-- rodapé do site-->
     <footer>
        <p>&copy;2026 Sistema de Gestão de Clientes - Todos os direitos reservados</p>

        <p>Desenvolvido para fins didáticos </p>
     </footer>
</body>
</html>
